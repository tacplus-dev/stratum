// Stratum — the record store, one per tenant.
//
// Stratum holds a tenant's (spec.record) rows in memory (Hazelcast, members
// spread across zones with zone-aware backups: availability, not durability)
// and serves the generated record plane over them: the query plane, the write
// surface (Put, InsertIfAbsent, ReplaceIfUnchanged, Delete, Apply), Get and
// Watch<T>Changes. It holds no durable state. Durability is the redo service:
// a write is applied only once the redo has acked it at the level its record
// type declares, and every start replays the tenant from the redo. See
// docs/DURABILITY.md and design.md.
//
syntax = "proto3";

package stratum;

import "sys/spec.proto";
import "sys/healthreport.proto";

option (spec.service) = {tenant_owned: true};

// Every write is appended to the redo service (the log is the database) before
// it is applied, and every start replays the tenant from it: redolog.Redo, the
// sys contract tacplus defines and the redo service hosts.
option (spec.grpc_s2s_client) = {service: "redolog.Redo"};
option (spec.int_const) = {name: "DEFAULT_PORT", value: 8443};

// Stratum used to declare s2s clients against agentsensor.TimedbQuery and
// agentsensor.GraphdbQuery to federate projection queries into timedb and
// graphdb. Both went to the boneyard 2026-08-25 (BIG GOAL 3, first move #1) and
// the federation model was already superseded by the 2026-08-23 "client calls,
// NOT federation" ruling. Stratum now reaches no other store.

// Stratum is the record store. Records are written through its own generated
// write surface and never ingested from the event bus (decisions:
// tacplus-dev/roadmap stratum-per-tenant-2026-10-25.md, item 3).
option (spec.record_store) = {no_bus_ingest: true};

// ============================================================================
// Config
// ============================================================================

message Config {
  option (spec.grpc_config) = {service_name: "stratum"};

  // hazelcast_memory_mb is the Hazelcast cluster memory limit in MB. Default: 2048.
  int32 hazelcast_memory_mb = 1 [(spec.default_int) = 2048, (spec.assert_ge) = 256];

  // write_ack_timeout_ms bounds how long a write waits for the redo service's
  // ack at the level it is owed. A write not acked in time is refused
  // (UNAVAILABLE) and not applied. Default: 10000. Min: 100.
  int32 write_ack_timeout_ms = 9 [(spec.default_int) = 10000, (spec.assert_ge) = 100];

  // Fields 2 and 4-8 configured working-set maps, the retention sweep, the
  // daily checkpoint and the warm tier, all removed with the per-tenant,
  // in-memory rebuild (stratum#2).
  reserved 2, 4, 5, 6, 7, 8;
  reserved "map_idle_ttl_seconds", "max_maps", "retention_days", "cleanup_interval_seconds",
      "active_session_idle_seconds", "warm_window_seconds";
}

// ============================================================================
// State
// ============================================================================

message StratumState {
  option (spec.service_state) = {label: ["kernel"], auto_tls: TLS_KEY_TYPE_ED25519};
}

// ============================================================================
// Typed Health
// ============================================================================

message StratumServiceHealth {
  option (spec.service_health) = {};

  // Required: base health for gateway routing.
  healthreport.ServiceInstanceHealth base = 1;

  // Timestamp of this snapshot.
  int64 timestamp_ms = 2;

  // Record store stats: rows held across every record type.
  int64 event_count                  = 3;
  int64 hazelcast_memory_used_bytes  = 4;
  int64 hazelcast_memory_total_bytes = 5;

  // Field 6 counted working-set maps, removed with stratum#2.
  reserved 6;
  reserved "active_maps";
}
