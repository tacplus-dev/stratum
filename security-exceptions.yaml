    reason: "No HEALTHCHECK in the Dockerfile: the distroless image has no shell, health is the launcher's HEALTH_PORT probe, read by Kubernetes probes, and Kubernetes ignores HEALTHCHECK (#40)."
    decided_by: jodydadescott
    expires: 2027-05-17
