    reason: "Only jackson-databind 2.21.2 and 3.1.2 shaded in Hazelcast 5.7.0 (com.hazelcast.shaded.*), where no class outside the databind references it: dead code (#28)."
    decided_by: jodydadescott
    expires: 2026-12-03
  - id: CVE-2026-91776
    reason: "Only jackson-databind 2.21.2 and 3.1.2 shaded in Hazelcast 5.7.0 (com.hazelcast.shaded.*), where no class outside the databind references it: dead code (#28)."
    decided_by: jodydadescott
    expires: 2026-12-03
