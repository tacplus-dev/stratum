# Findings the security checks accept (looper-scan's build and nightly scans),
# each with its reason, who decided and an expiry: on expiry the finding is
# reported again and the policy fails, so an exception is re-examined, never
# silently kept. The release jar's own advisories are in
# .trivyignore.yaml (`just audit-jar`).

exceptions:
